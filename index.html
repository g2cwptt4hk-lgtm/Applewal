<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="theme-color" content="#000000" />
  <title>Wallet</title>
  <link rel="manifest" href="manifest.json" />
  <link rel="apple-touch-icon" href="icon-192.png" />
  <style>
    :root {
      --bg: #000000;
      --text: #ffffff;
      --muted: #8e8e93;
      --muted2: #636366;
      --accent: #0a84ff;
      --danger: #ff453a;
      --success: #30d158;
      --surface: #1c1c1e;
      --surface-2: #2c2c2e;
      --surface-3: #3a3a3c;
      --separator: rgba(84,84,88,0.55);
      --card-radius: 16px;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; -webkit-user-select: none; user-select: none; }
    html, body {
      height: 100%;
      background: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "SF Pro Display", "Helvetica Neue", Helvetica, Arial, sans-serif;
      overflow: hidden;
      overscroll-behavior: none;
      -webkit-font-smoothing: antialiased;
    }

    .status-bar { height: env(safe-area-inset-top, 47px); }
    .app { height: 100%; display: flex; flex-direction: column; }

    /* ===== HEADER ===== */
    .header {
      padding: 4px 16px 10px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-shrink: 0;
    }
    .header h1 {
      font-size: 34px;
      font-weight: 700;
      letter-spacing: -0.8px;
      line-height: 1.1;
    }
    .header-right {
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .circle-btn {
      width: 36px;
      height: 36px;
      border-radius: 50%;
      background: #2c2c2e;
      border: none;
      color: #ffffff;
      font-size: 24px;
      font-weight: 300;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      line-height: 1;
      padding-bottom: 2px;
    }
    .pill-btn {
      height: 36px;
      padding: 0 12px 0 14px;
      border-radius: 18px;
      background: #2c2c2e;
      border: none;
      color: #ffffff;
      display: flex;
      align-items: center;
      gap: 8px;
      cursor: pointer;
      font-size: 15px;
    }
    .pill-btn .dots {
      font-size: 16px;
      letter-spacing: 0.5px;
      opacity: 0.95;
    }

    /* ===== VIEWS ===== */
    .view {
      display: none;
      flex: 1;
      overflow-y: auto;
      -webkit-overflow-scrolling: touch;
      padding-bottom: calc(50px + env(safe-area-inset-bottom, 0px));
    }
    .view.active { display: block; }

    /* ===== CARD STACK ===== */
    .card-stack {
      padding: 6px 16px 40px;
      position: relative;
    }
    .wallet-card {
      /* Apple Wallet card ratio ≈ 1.586:1 (standard CR80 credit card) */
      width: 100%;
      aspect-ratio: 1.586 / 1;
      height: auto;
      border-radius: var(--card-radius);
      overflow: hidden;
      background-size: cover;
      background-position: center;
      background-repeat: no-repeat;
      color: white;
      position: relative;
      box-shadow: 0 10px 30px rgba(0,0,0,0.55);
      margin-bottom: -58%; /* heavy overlap relative to height */
      transition: transform 0.18s ease, box-shadow 0.18s ease;
      cursor: grab;
      touch-action: none;
    }
    .wallet-card:last-child { margin-bottom: 0; }
    .wallet-card:active { cursor: grabbing; }
    .wallet-card.dragging {
      opacity: 0.92;
      transform: scale(1.03);
      box-shadow: 0 16px 40px rgba(0,0,0,0.6);
      z-index: 100;
    }

    .wallet-card .card-inner {
      height: 100%;
      padding: 18px 20px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
    }
    .card-top-row {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
    }
    .card-name {
      font-size: 15px;
      font-weight: 600;
      letter-spacing: -0.2px;
      text-shadow: 0 1px 3px rgba(0,0,0,0.8), 0 0 8px rgba(0,0,0,0.5);
      max-width: 70%;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    .card-badge {
      font-size: 12px;
      font-weight: 500;
      opacity: 0.9;
      text-shadow: 0 1px 3px rgba(0,0,0,0.8), 0 0 6px rgba(0,0,0,0.4);
    }
    .card-bottom-row {
      display: flex;
      justify-content: space-between;
      align-items: flex-end;
    }
    .card-last4 {
      font-size: 17px;
      font-weight: 500;
      letter-spacing: 1.8px;
      text-shadow: 0 1px 3px rgba(0,0,0,0.9), 0 0 10px rgba(0,0,0,0.5);
      color: #ffffff;
    }

    .bg-blue { background: linear-gradient(145deg, #1a5fb4, #0c3d8a); }
    .bg-black { background: linear-gradient(145deg, #2c2c2e, #111); }
    .bg-gold { background: linear-gradient(145deg, #d4a017, #8a6d0b); color: #1a1a1a; }
    .bg-silver { background: linear-gradient(145deg, #c0c0c0, #7a7a7a); color: #111; }
    .bg-purple { background: linear-gradient(145deg, #7c3aed, #4c1d95); }
    .bg-green { background: linear-gradient(145deg, #0d9488, #065f46); }
    .bg-red { background: linear-gradient(145deg, #dc2626, #7f1d1d); }
    .bg-indigo { background: linear-gradient(145deg, #4f46e5, #312e81); }

    .empty-cards {
      text-align: center;
      padding: 80px 20px;
      color: var(--muted);
      font-size: 16px;
    }

    /* ===== DETAIL VIEW ===== */
    .detail-top { padding: 0 16px 8px; }
    .back-circle {
      width: 36px;
      height: 36px;
      border-radius: 50%;
      background: #2c2c2e;
      border: none;
      color: #ffffff;
      font-size: 22px;
      font-weight: 300;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      margin-bottom: 14px;
      line-height: 1;
    }
    .detail-card {
      width: 100%;
      aspect-ratio: 1.586 / 1;
      height: auto;
      border-radius: var(--card-radius);
      overflow: hidden;
      background-size: cover;
      background-position: center;
      background-repeat: no-repeat;
      margin-bottom: 16px;
      box-shadow: 0 8px 24px rgba(0,0,0,0.45);
      position: relative;
    }
    .detail-card .card-inner {
      height: 100%;
      padding: 18px 20px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      color: white;
    }

    .stats-row {
      display: flex;
      gap: 12px;
      margin-bottom: 6px;
    }
    .stat-card {
      flex: 1;
      background: #1c1c1e;
      border-radius: 14px;
      padding: 14px 16px;
    }
    .stat-label {
      font-size: 13px;
      color: #8e8e93;
      margin-bottom: 3px;
      font-weight: 400;
    }
    .stat-value {
      font-size: 22px;
      font-weight: 600;
      letter-spacing: -0.5px;
    }
    .activity-bars {
      display: flex;
      align-items: flex-end;
      gap: 3.5px;
      height: 34px;
      margin-top: 6px;
    }
    .activity-bars span {
      flex: 1;
      background: #3a3a3c;
      border-radius: 2.5px;
      min-height: 5px;
    }
    .activity-bars span.active {
      background: #64d2ff;
    }

    .updated {
      font-size: 13px;
      color: #8e8e93;
      margin: 2px 0 18px 2px;
      font-weight: 400;
    }

    .section-title {
      font-size: 20px;
      font-weight: 600;
      letter-spacing: -0.3px;
      margin-bottom: 10px;
      padding-left: 1px;
    }

    .tx-list {
      background: #1c1c1e;
      border-radius: 14px;
      overflow: hidden;
    }
    .tx-item {
      display: flex;
      align-items: center;
      padding: 14px 16px;
      border-bottom: 0.5px solid var(--separator);
      cursor: pointer;
      gap: 0;
    }
    .tx-item:last-child { border-bottom: none; }
    .tx-info { flex: 1; min-width: 0; padding-right: 12px; }
    .tx-merchant {
      font-size: 16px;
      font-weight: 400;
      letter-spacing: -0.2px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      color: #ffffff;
    }
    .tx-sub {
      font-size: 13px;
      color: #8e8e93;
      margin-top: 2px;
      font-weight: 400;
    }
    .tx-right {
      text-align: right;
      flex-shrink: 0;
      display: flex;
      align-items: center;
      gap: 2px;
    }
    .tx-amount {
      font-size: 16px;
      font-weight: 400;
      font-variant-numeric: tabular-nums;
      letter-spacing: -0.2px;
      color: #ffffff;
    }
    .tx-amount.credit { color: #30d158; }
    .tx-chevron {
      color: #636366;
      font-size: 20px;
      font-weight: 300;
      margin-left: 2px;
      line-height: 1;
    }

    /* Floating search button */
    .fab-search {
      position: fixed;
      right: 20px;
      bottom: calc(28px + env(safe-area-inset-bottom, 0px));
      width: 52px;
      height: 52px;
      border-radius: 50%;
      background: #2c2c2e;
      border: none;
      color: #ffffff;
      font-size: 20px;
      display: none;
      align-items: center;
      justify-content: center;
      box-shadow: 0 4px 16px rgba(0,0,0,0.4);
      cursor: pointer;
      z-index: 50;
    }
    #detail-view.active ~ .fab-search,
    .view.active#detail-view + .fab-search { display: flex; }
    /* show via JS instead */

    /* ===== TRANSACTION DETAIL ===== */
    .tx-detail {
      padding: 0 20px;
      text-align: center;
    }
    .tx-detail-amount {
      font-size: 48px;
      font-weight: 600;
      letter-spacing: -1.8px;
      margin: 12px 0 8px;
      line-height: 1.05;
    }
    .tx-detail-merchant {
      font-size: 17px;
      color: #8e8e93;
      margin-bottom: 3px;
      font-weight: 400;
    }
    .tx-detail-date {
      font-size: 15px;
      color: #8e8e93;
      margin-bottom: 28px;
      font-weight: 400;
    }
    .info-card {
      background: #1c1c1e;
      border-radius: 14px;
      padding: 16px 18px;
      text-align: left;
      margin-bottom: 14px;
    }
    .info-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 5px 0;
    }
    .info-label { color: #8e8e93; font-size: 15px; font-weight: 400; }
    .info-value { font-size: 15px; font-weight: 500; color: #ffffff; }
    .info-divider {
      height: 0.5px;
      background: var(--separator);
      margin: 12px 0;
    }
    .status-block {
      padding: 2px 0 4px;
    }
    .status-main {
      font-size: 16px;
      font-weight: 500;
      color: #ffffff;
      margin-bottom: 3px;
    }
    .status-card-name {
      font-size: 15px;
      font-weight: 400;
      color: #8e8e93;
    }
    .action-btn {
      display: block;
      width: 100%;
      background: #1c1c1e;
      border: none;
      color: #0a84ff;
      padding: 15px;
      border-radius: 14px;
      font-size: 16px;
      font-weight: 400;
      text-align: center;
      margin-bottom: 12px;
      cursor: pointer;
    }
    .help-text {
      font-size: 13px;
      color: #8e8e93;
      text-align: left;
      line-height: 1.45;
      margin: 10px 4px 24px;
      font-weight: 400;
    }

    /* ===== ACTION SHEET ===== */
    .sheet-overlay {
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.5);
      z-index: 300;
      display: none;
      align-items: flex-end;
      justify-content: center;
    }
    .sheet-overlay.open { display: flex; }
    .sheet {
      background: #1c1c1e;
      width: 100%;
      max-width: 500px;
      border-radius: 14px 14px 0 0;
      padding: 10px 12px 34px;
      animation: slideUp 0.28s cubic-bezier(0.32,0.72,0,1);
    }
    @keyframes slideUp {
      from { transform: translateY(100%); }
      to { transform: translateY(0); }
    }
    .sheet-handle {
      width: 36px;
      height: 5px;
      background: #3a3a3c;
      border-radius: 3px;
      margin: 4px auto 14px;
    }
    .sheet-title {
      font-size: 13px;
      color: #8e8e93;
      text-align: center;
      margin-bottom: 8px;
      text-transform: uppercase;
      letter-spacing: 0.4px;
      font-weight: 500;
    }
    .sheet-item {
      display: flex;
      align-items: center;
      gap: 14px;
      padding: 15px 12px;
      border-radius: 12px;
      cursor: pointer;
      font-size: 17px;
      font-weight: 400;
      color: #ffffff;
    }
    .sheet-item:active { background: #2c2c2e; }
    .sheet-item .icon {
      width: 26px;
      text-align: center;
      font-size: 18px;
      opacity: 0.95;
    }
    .sheet-cancel {
      margin-top: 8px;
      text-align: center;
      padding: 15px;
      color: #0a84ff;
      font-size: 17px;
      font-weight: 500;
      cursor: pointer;
    }

    /* ===== EDITOR ===== */
    .editor-overlay {
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.55);
      z-index: 400;
      display: none;
      align-items: flex-end;
      justify-content: center;
    }
    .editor-overlay.open { display: flex; }
    .editor-panel {
      background: #1c1c1e;
      width: 100%;
      max-width: 500px;
      max-height: 92vh;
      border-radius: 14px 14px 0 0;
      overflow-y: auto;
      padding: 16px 18px 40px;
      animation: slideUp 0.28s cubic-bezier(0.32,0.72,0,1);
    }
    .editor-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 18px;
    }
    .editor-header h2 { font-size: 18px; font-weight: 600; letter-spacing: -0.3px; }
    .close-btn {
      width: 28px; height: 28px; border-radius: 50%;
      background: #2c2c2e; border: none; color: white;
      font-size: 17px; cursor: pointer;
      display: flex; align-items: center; justify-content: center;
      line-height: 1;
    }
    .form-group { margin-bottom: 14px; }
    .form-group label {
      display: block; font-size: 13px; color: #8e8e93;
      margin-bottom: 5px; font-weight: 400;
    }
    .form-group input, .form-group select, .form-group textarea {
      width: 100%; background: #2c2c2e; border: none;
      border-radius: 10px; padding: 12px 13px; color: white;
      font-size: 16px; outline: none;
      -webkit-user-select: text; user-select: text;
      font-family: inherit;
    }
    .form-group input:focus, .form-group select:focus {
      box-shadow: 0 0 0 2px #0a84ff;
    }
    .form-row { display: flex; gap: 10px; }
    .form-row .form-group { flex: 1; }
    .color-row { display: flex; gap: 9px; flex-wrap: wrap; }
    .color-swatch {
      width: 34px; height: 34px; border-radius: 50%;
      border: 2.5px solid transparent; cursor: pointer;
    }
    .color-swatch.selected { border-color: white; }
    .btn-row { display: flex; gap: 10px; margin-top: 20px; }
    .btn {
      flex: 1; padding: 13px; border: none; border-radius: 12px;
      font-size: 16px; font-weight: 600; cursor: pointer;
      font-family: inherit;
    }
    .btn-primary { background: #0a84ff; color: white; }
    .btn-danger { background: #ff453a; color: white; }
    .btn-secondary { background: #2c2c2e; color: white; }
    .upload-area {
      border: 1.5px dashed rgba(255,255,255,0.25);
      border-radius: 10px; padding: 18px; text-align: center;
      color: #8e8e93; cursor: pointer; font-size: 14px;
    }
    .upload-area input { display: none; }
    .preview-img {
      max-width: 100%; max-height: 100px; border-radius: 8px; margin-top: 8px;
    }
  </style>
</head>
<body>
  <div class="app">
    <div class="status-bar"></div>

    <!-- MAIN WALLET VIEW -->
    <div id="wallet-view" class="view active">
      <div class="header">
        <h1>Wallet</h1>
        <div class="header-right">
          <button class="circle-btn" id="plus-btn">+</button>
          <button class="pill-btn" id="more-btn">
            <span style="font-size:15px;">▣</span>
            <span class="dots">•••</span>
          </button>
        </div>
      </div>
      <div class="card-stack" id="card-stack"></div>
    </div>

    <!-- CARD DETAIL VIEW -->
    <div id="detail-view" class="view">
      <div class="detail-top">
        <button class="back-circle" id="back-btn">‹</button>
        <div class="detail-card" id="detail-card"></div>
        <div class="stats-row">
          <div class="stat-card">
            <div class="stat-label">Available Balance</div>
            <div class="stat-value" id="balance-value">£0.00</div>
          </div>
          <div class="stat-card">
            <div class="stat-label">Weekly Activity</div>
            <div class="activity-bars" id="activity-bars">
              <span></span><span></span><span class="active"></span><span></span><span></span><span></span><span></span>
            </div>
          </div>
        </div>
        <div class="updated">Updated just now</div>
        <div class="section-title">Latest Transactions</div>
        <div class="tx-list" id="transactions-list"></div>
      </div>
    </div>

    <!-- TRANSACTION DETAIL VIEW -->
    <div id="tx-detail-view" class="view">
      <div class="detail-top">
        <button class="back-circle" id="tx-back-btn">‹</button>
      </div>
      <div class="tx-detail" id="tx-detail-content"></div>
    </div>
  </div>

  <button class="fab-search" id="fab-search" style="display:none;" aria-label="Search">
    <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2.2" stroke-linecap="round">
      <circle cx="11" cy="11" r="7"/>
      <path d="M21 21l-4.3-4.3"/>
    </svg>
  </button>

  <!-- + ACTION SHEET -->
  <div class="sheet-overlay" id="plus-sheet">
    <div class="sheet">
      <div class="sheet-handle"></div>
      <div class="sheet-title">Wallet</div>
      <div class="sheet-item" id="action-add-card">
        <span class="icon">＋</span> Add Card
      </div>
      <div class="sheet-item" id="action-edit-cards">
        <span class="icon">✎</span> Edit / Manage Cards
      </div>
      <div class="sheet-item" id="action-add-tx">
        <span class="icon">↗</span> Add Transaction
      </div>
      <div class="sheet-cancel" id="sheet-cancel">Cancel</div>
    </div>
  </div>

  <!-- EDITOR OVERLAY -->
  <div class="editor-overlay" id="editor-overlay">
    <div class="editor-panel" id="editor-panel"></div>
  </div>

  <script>
    const STORAGE_KEY = 'wallet_sim_v3';
    const CURRENCIES = {
      USD: { code: 'USD', locale: 'en-US', symbol: '$' },
      GBP: { code: 'GBP', locale: 'en-GB', symbol: '£' },
      EUR: { code: 'EUR', locale: 'de-DE', symbol: '€' },
      CAD: { code: 'CAD', locale: 'en-CA', symbol: 'C$' },
      AUD: { code: 'AUD', locale: 'en-AU', symbol: 'A$' },
      JPY: { code: 'JPY', locale: 'ja-JP', symbol: '¥' }
    };
    const BG_COLORS = ['bg-blue','bg-black','bg-gold','bg-silver','bg-purple','bg-green','bg-red','bg-indigo'];

    let cards = [];
    let currentCardId = null;
    let currentTxId = null;
    let dragState = null;

    // ========== STORAGE ==========
    function loadData() {
      try {
        const raw = localStorage.getItem(STORAGE_KEY);
        if (raw) {
          cards = JSON.parse(raw);
          cards.forEach(c => {
            if (!c.currency) c.currency = 'GBP';
            if (!c.transactions) c.transactions = [];
            c.transactions.forEach(t => {
              if (!t.datetime) t.datetime = (t.date || '2026-10-01') + 'T12:00';
            });
          });
        } else {
          cards = getDefaultCards();
          saveData();
        }
      } catch (e) {
        cards = getDefaultCards();
      }
    }
    function saveData() {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(cards));
    }
    function getDefaultCards() {
      return [
        {
          id: 'c1', name: 'Trading 212', lastFour: '', network: 'Virtual', currency: 'GBP',
          bg: 'bg-black', customImage: null, balance: 0,
          transactions: []
        },
        {
          id: 'c2', name: 'American Express', lastFour: '6307', network: 'Amex', currency: 'GBP',
          bg: 'bg-black', customImage: null, balance: 211.56,
          transactions: [
            { id: 't1', merchant: 'Holder S&tj', amount: 35.00, datetime: '2026-10-04T23:00', note: 'Transfer', category: 'income' },
            { id: 't2', merchant: 'Esso', amount: -5.25, datetime: '2026-10-04T22:50', note: '', category: 'transport' },
            { id: 't3', merchant: 'Esso', amount: -4.45, datetime: '2026-10-04T22:40', note: '', category: 'transport' }
          ]
        }
      ];
    }

    // ========== RENDER MAIN ==========
    function renderCardStack() {
      const stack = document.getElementById('card-stack');
      stack.innerHTML = '';
      if (cards.length === 0) {
        stack.innerHTML = '<div class="empty-cards">No cards yet.<br>Tap + to add one.</div>';
        return;
      }
      cards.forEach((card, i) => {
        const el = document.createElement('div');
        el.className = 'wallet-card ' + (card.customImage ? '' : card.bg);
        el.dataset.id = card.id;

    // ========== CARD DETAIL ==========
    function openCardDetail(id) {
      currentCardId = id;
      const card = cards.find(c => c.id === id);
      if (!card) return;

      document.getElementById('wallet-view').classList.remove('active');
      document.getElementById('tx-detail-view').classList.remove('active');
      document.getElementById('detail-view').classList.add('active');

      const detailCard = document.getElementById('detail-card');

      detailCard.innerHTML = `
        <div class="card-inner">
          <div class="card-top-row"></div>

            <div class="card-last4">${card.lastFour ? '•••• ' + esc(card.lastFour) : ''}</div>

          </div>
        </div>`;

      const currency = CURRENCIES[card.currency] || CURRENCIES.GBP;
      // Calculate balance from transactions if not set
      let bal = card.balance;
      if (bal === undefined || bal === null) {
        bal = card.transactions.reduce((sum, t) => sum + t.amount, 0);
      }
      document.getElementById('balance-value').textContent = formatMoney(bal, currency);

      renderTransactions(card);
    }

    function renderTransactions(card) {
      const list = document.getElementById('transactions-list');
      if (!card.transactions || card.transactions.length === 0) {
        list.innerHTML = '<div style="padding:30px;text-align:center;color:var(--muted);">No transactions yet.<br>Use + to add some.</div>';
        return;
      }
      const sorted = card.transactions.slice().sort((a,b) => (b.datetime || '').localeCompare(a.datetime || ''));
      const currency = CURRENCIES[card.currency] || CURRENCIES.GBP;

      list.innerHTML = sorted.map(tx => {
        const timeStr = relativeTime(tx.datetime);
        const isCredit = tx.amount > 0;
        const sub = tx.note ? esc(tx.note) + ' · ' + timeStr : timeStr;
        return `
          <div class="tx-item" data-txid="${tx.id}">
            <div class="tx-info">
              <div class="tx-merchant">${esc(tx.merchant)}</div>
              <div class="tx-sub">${sub}</div>
            </div>
            <div class="tx-right">
              <span class="tx-amount ${isCredit ? 'credit' : ''}">${isCredit ? '+' : ''}${formatMoney(Math.abs(tx.amount), currency)}</span>
              <span class="tx-chevron">›</span>
            </div>
          </div>`;
      }).join('');

      list.querySelectorAll('.tx-item').forEach(el => {
        let timer = null, longPress = false;
        el.addEventListener('click', () => { if (longPress) { longPress=false; return; } openTxDetail(card.id, el.dataset.txid); });
        const start=()=>{ clearTimeout(timer); timer=setTimeout(()=>{ longPress=true; openTransactionActions(card.id, el.dataset.txid); },600); };
        const cancel=()=>clearTimeout(timer);
        el.addEventListener('touchstart',start,{passive:true}); el.addEventListener('touchend',cancel); el.addEventListener('touchcancel',cancel); el.addEventListener('touchmove',cancel);
        el.addEventListener('mousedown',start); el.addEventListener('mouseup',cancel); el.addEventListener('mouseleave',cancel);
      });
    }

    function generateRandomTransactions(cardId) {
      const card = cards.find(c => c.id === cardId); if (!card) return;
      const merchants = [
        ['Tesco','Groceries',8,75,-1],['Sainsbury’s','Groceries',7,65,-1],['Esso','Fuel',15,70,-1],['Uber','Transport',8,42,-1],
        ['Amazon','Shopping',12,120,-1],['Apple','Purchase',2,45,-1],['Pret A Manger','Food & Drink',4,18,-1],['McDonald’s','Food & Drink',5,16,-1],
        ['Waitrose','Groceries',10,90,-1],['Shell','Fuel',20,75,-1],['Netflix','Subscription',6,18,-1],['Spotify','Subscription',6,13,-1],
        ['Salary','Income',100,900,1],['Transfer','Transfer',25,350,1],['Refund','Refund',5,80,1] ];
      const today = new Date(); today.setHours(0,0,0,0);
      const r = (a,b) => Math.floor(Math.random()*(b-a+1))+a;
      const pad = n => String(n).padStart(2,'0');
      for (let i=0;i<10;i++) {
        const m=merchants[r(0,merchants.length-1)], d=new Date(today); d.setDate(d.getDate()-r(1,60)); d.setHours(r(6,23),r(0,59),0,0);
        const amount=r(m[2]*100,m[3]*100)/100*m[4];
        const tx={id:uid(),merchant:m[0],amount,datetime:`${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}T${pad(d.getHours())}:${pad(d.getMinutes())}`,note:m[1],category:amount>0?'income':'spend'};
        card.transactions.push(tx); card.balance=(Number(card.balance)||0)+amount;
      }
      saveData(); closeEditor(); alert(`Added 10 random transactions to ${card.name}.`); openCardDetail(card.id);
    }

    // ========== DRAG TO REORDER ==========
    function setupCardDrag(el) {
      let startY = 0;
      let originY = 0;
      let startIndex = 0;
      let currentIndex = 0;
      let isDragging = false;
      let pointerId = null;

      function idxOf(node) {
        return Array.from(node.parentNode.children).indexOf(node);
      }

      function begin(clientY) {
        startY = clientY;
        originY = clientY;
        startIndex = idxOf(el);
        currentIndex = startIndex;
        isDragging = false;
        dragState = { moved: false, el: el };
      }

      function move(clientY) {
        if (!dragState || dragState.el !== el) return;
        const total = Math.abs(clientY - originY);

        // Only start real drag after 12px movement
        if (total > 12 && !isDragging) {
          isDragging = true;
          dragState.moved = true;
          el.classList.add('dragging');
          el.style.zIndex = '300';
          el.style.transition = 'none';
        }
        if (!isDragging) return;

        const dy = clientY - startY;
        el.style.transform = 'translateY(' + dy + 'px) scale(1.03)';

        const stack = document.getElementById('card-stack');
        const mid = el.getBoundingClientRect().top + el.getBoundingClientRect().height * 0.5;
        const others = Array.from(stack.querySelectorAll('.wallet-card:not(.dragging)'));

        let target = currentIndex;
        others.forEach(function(other) {
          const oMid = other.getBoundingClientRect().top + other.getBoundingClientRect().height * 0.5;
          const oIdx = idxOf(other);
          if (mid < oMid && oIdx < currentIndex) target = Math.min(target, oIdx);
          if (mid > oMid && oIdx > currentIndex) target = Math.max(target, oIdx);
        });

        if (target !== currentIndex) {
          // Update data
          const item = cards.splice(currentIndex, 1)[0];
          cards.splice(target, 0, item);

          // Update DOM without full re-render (smooth)
          const children = Array.from(stack.children);
          if (target >= children.length - 1) {
            stack.appendChild(el);
          } else {
            const ref = stack.children[target];
            if (ref && ref !== el) stack.insertBefore(el, ref);
          }
          currentIndex = target;
          // Keep finger under the card
          startY = clientY;
          el.style.transform = 'scale(1.03)';
        }
      }

      function end() {
        if (!dragState || dragState.el !== el) return;
        el.classList.remove('dragging');
        el.style.transform = '';
        el.style.zIndex = '';
        el.style.transition = '';

        if (isDragging) {
          saveData();
          // Full re-render to clean up any transform leftovers
          renderCardStack();
        }
        setTimeout(function() { dragState = null; }, 100);
      }

      // ----- Touch -----
      el.addEventListener('touchstart', function(e) {
        if (e.touches.length !== 1) return;
        begin(e.touches[0].clientY);
      }, { passive: true });

      el.addEventListener('touchmove', function(e) {
        if (!dragState || dragState.el !== el) return;
        if (isDragging) e.preventDefault();
        move(e.touches[0].clientY);
      }, { passive: false });

      el.addEventListener('touchend', end);
      el.addEventListener('touchcancel', end);

      // ----- Mouse -----
      el.addEventListener('mousedown', function(e) {
        if (e.button !== 0) return;
        begin(e.clientY);
        function onMove(ev) {
          if (isDragging) ev.preventDefault();
          move(ev.clientY);
        }
        function onUp() {
          end();
          window.removeEventListener('mousemove', onMove);
          window.removeEventListener('mouseup', onUp);
        }
        window.addEventListener('mousemove', onMove);
        window.addEventListener('mouseup', onUp);
      });
    }

    // ========== HELPERS ==========
    function uid() { return Date.now().toString(36) + Math.random().toString(36).slice(2,6); }
    function esc(str) {
      if (!str) return '';
      return String(str).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
    }
    function formatMoney(amount, currency) {
      const abs = Math.abs(amount);
      return new Intl.NumberFormat(currency.locale, {
        style: 'currency',
        currency: currency.code,
        minimumFractionDigits: currency.code === 'JPY' ? 0 : 2
      }).format(abs);
    }
    function relativeTime(datetime) {
      if (!datetime) return '';
      const d = new Date(datetime);
      const now = new Date();
      const diffMs = now - d;
      const mins = Math.floor(diffMs / 60000);
      if (mins < 1) return 'Just now';
      if (mins < 60) return mins + ' minutes ago';
      const hours = Math.floor(mins / 60);
      if (hours < 24) return hours + ' hour' + (hours > 1 ? 's' : '') + ' ago';
      const days = Math.floor(hours / 24);
      if (days < 7) return days + ' day' + (days > 1 ? 's' : '') + ' ago';
      return d.toLocaleDateString('en-US', { month: 'short', day: 'numeric' });
    }

    // ========== EVENTS ==========
    document.getElementById('plus-btn').onclick = openPlusSheet;
    document.getElementById('sheet-cancel').onclick = closePlusSheet;
    document.getElementById('plus-sheet').addEventListener('click', (e) => {
      if (e.target.id === 'plus-sheet') closePlusSheet();
    });
    document.getElementById('action-add-card').onclick = () => openCardEditor();
    document.getElementById('action-edit-cards').onclick = openManageCards;
    document.getElementById('action-add-tx').onclick = openAddTransactionPicker;

    document.getElementById('back-btn').onclick = () => {
      document.getElementById('detail-view').classList.remove('active');
      document.getElementById('wallet-view').classList.add('active');
      document.getElementById('fab-search').style.display = 'none';
      currentCardId = null;
      renderCardStack();
    };
    document.getElementById('tx-back-btn').onclick = () => {
      document.getElementById('tx-detail-view').classList.remove('active');
      if (currentCardId) openCardDetail(currentCardId);
    };

    document.getElementById('editor-overlay').addEventListener('click', (e) => {
      if (e.target.id === 'editor-overlay') closeEditor();
    });

    // ========== INIT ==========
    loadData();
    renderCardStack();

    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('sw.js').catch(() => {});
    }
  </script>
</body>
